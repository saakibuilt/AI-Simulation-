services:
  analyticsfish:
    image: ghcr.io/666ghj/analyticsfish:latest
    # Mirror image for faster pulling if needed
    # image: ghcr.nju.edu.cn/666ghj/analyticsfish:latest
    container_name: analyticsfish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads